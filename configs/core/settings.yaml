event:
  host: 127.0.0.1
heartbeat_sec: 20
hang_timeout_sec: 1800
report_dedupe_hours: 20
housekeeping:
  enabled: true
  log_days: 14
  report_days: 30
  events_max_mb: 50
configsync:
  # 导入旧副本配置时的源根目录（读取 BAAH/BAAH_CONFIGS、March7thAssistant、MaaEnd 的配置）。
  source_root: E:/GameAFK
chain:
  order: []
  # 需要同时运行的项目组，形如 [[A, B], [C, D]]。只有相邻的两个项目能配成一组
  # （总览里卡片上的「并行」按钮各点一次即可生成），链式调度时同组项目一起启动。
  parallel_blocks: []
  continue_on_failure: true
  retry_failed_at_end: true
  max_attempts_per_project: 3
idle:
  enabled: true
  minutes: 30
  prompt_sec: 30
  cooldown_min: 30
  # 今天已成功完成过一轮链时不自动执行（日常已经做完了，避免重复挂机）。
  # 只有「整链成功」才算完成；单个项目手动跑成功不算。
  skip_if_completed_today: true
  autostart: false
  autostart_mode: admin
repair:
  enabled: true
  max_rounds: 2
  auto_unsafe: false
  retry_delay_sec: 5
notifications:
  enabled: false
  provider: serverchan
  params: {}
  toast: true
  dedupe_sec: 30
post_actions:
  after_all: none
  delay_sec: 60
doctor:
  emulator_processes:
  - mumuplayer
  - nemuplayer
  - dnplayer
  - lmdplayer
  - MuMuNxDevice
  game_processes:
  - endfield
  - starrail
  - bluearchive
  - arknights
  emulator_exe: ''
  game_exe: ''
gui:
  minimize_to_tray: false
  autostart_chain_on_launch: false
  widget_enabled: false
  # 上次退出时的窗口尺寸 [宽, 高]，程序自己写回；空表示用屏幕自适应默认值。
  window_size: []
  widget_pos: []
  # 外观：主题 dark / light；背景图可填相对仓库根的路径，留空表示不用。
  theme: dark
  background_image: ''
  background_opacity: 100
  project_colors:
    March7thAssistant: '#4fc3f7'
    BAAH: '#81c784'
    MaaEnd: '#ffb74d'
    ZenlessZoneZero-OneDragon: '#b388ff'
    BetterGI: '#ffd54f'
    core: '#ce93d8'
    emulator: '#4db6ac'
    update: '#90a4ae'
  # 总览里被「×」收起的项目（注册表里仍然保留，可在设置页放回）。
  hidden_projects: []
schedule:
  enabled: false
  time: 04:00
  days:
  - mon
  - tue
  - wed
  - thu
  - fri
  - sat
  - sun
pre_run:
  enabled: true
  at_startup: true
  update_projects: true
  update_emulator: true
  update_concurrency: 0
  emulator:
    enabled: true
    manage: true
    main_exe: E:\MuMuPlayer\nx_main\MuMuNxMain.exe
    device_exe: E:\MuMuPlayer\nx_device\15.0\shell\MuMuNxDevice.exe
    manager_exe: E:\MuMuPlayer\nx_main\MuMuManager.exe
    vmindex: 0
    adb_port: 16384
    ready_timeout_sec: 240
    # MuMu 刚开机时 adb 端口要过几秒才开始监听，单次 `adb connect` 必然被
    # 「积极拒绝 (10061)」，日志里就会反复出现启动报错。这里给重试窗口：
    # 每次间隔 adb_connect_interval_sec，最多试 adb_connect_retries 次；
    # 全失败后再用 MuMuManager 自带的 adb 通道兜底一次。
    adb_connect_retries: 6
    adb_connect_interval_sec: 5.0
    close_after_run: true
    minimize_window: true
    show_before_minimize: true
    show_before_minimize_sec: 3
    minimize_retries: 10
    minimize_interval_sec: 1.0
    minimize_watchdog_sec: 90
    suppress_prompt: false
    updater_config: E:\MuMuPlayer\configs\main\nx_updater_config.json
    updater_exe: E:\MuMuPlayer\nx_main\MuMuNxUpdater.exe
    # MuMu 的 Qt GUI 前端（MuMuNxUpdater.exe）在本机无法初始化 Qt 平台插件，
    # 一启动就 0xC0000409 崩溃并弹出
    # "This application failed to start because no Qt platform plugin could be
    #  initialized."。改用 none：完全不启动更新器 GUI，需要时手动更新。
    # 可选值：gui（弹更新窗口）| auto（静默自动更新）| none（不检查）
    updater_mode: none
    always_open: false
    close_main_after_update: true
    timeout_sec: 600
