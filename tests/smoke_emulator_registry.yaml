groups: []

projects:
  EmuSmoke:
    display_name: Emulator Smoke
    enabled: true
    launch_type: python
    path: .
    python: .venv\Scripts\python.exe
    args: [tests\smoke_proj_ok.py, E, "1"]
    retry: 0
    hang_timeout: 120
    require_finish: false
    min_runtime_sec: 0
    manage_emulator: true
    config_dir: configs\core
    success_patterns: [done]
    error_patterns: ['Traceback \(most recent call last\)']
    finish_patterns: []
