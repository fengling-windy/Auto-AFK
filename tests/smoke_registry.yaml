groups:
  - id: smoke
    label: smoke
    parallel: false
    members:
      - SmokeProject

projects:
  SmokeProject:
    display_name: Smoke Project
    enabled: true
    launch_type: python
    path: .
    python: .venv\Scripts\python.exe
    args:
      - tests\smoke_project.py
    retry: 0
    hang_timeout: 120
    config_dir: configs\core
    success_patterns:
      - done
    error_patterns:
      - ModuleNotFoundError
      - RuntimeError
    finish_patterns: []
